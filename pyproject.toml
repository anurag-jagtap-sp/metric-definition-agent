[project]
name = "metric-agent"
version = "0.1.0"
description = "Drafts dbt MetricFlow definitions from formulas stated in Confluence pages, for human review."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "atlassian-python-api>=3.41",
    "dbt-core>=1.8",
    "dbt-duckdb>=1.8",
    "dbt-metricflow>=0.7",
    "pydantic>=2.7",
    "pydantic-settings>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.scripts]
metric-agent = "metric_agent.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["metric-agent/metric_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["metric_agent"]
